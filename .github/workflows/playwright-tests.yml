
name: Python Playwright Tests and Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Playwright login tests
        run: |
          python -m pytest test/Login/test_login.py \
            --browser chromium \
            --alluredir=allure-results \
            --clean-alluredir \
            -v

      - name: Set up Java
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline@2

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d allure-results ] && \
             [ -n "$(ls -A allure-results)" ]; then
            allure generate allure-results \
              --clean -o allure-report
          else
            mkdir -p allure-report
            echo "<h1>No test results generated</h1>" \
              > allure-report/index.html
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload report for GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

  deploy-report:
    if: github.ref == 'refs/heads/main' && always()
    needs: playwright-tests
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4
